name: Validar frontend antes do merge

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    name: Frontend Vitest e build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Obter código exato do PR / merge queue
        uses: actions/checkout@v4
      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências com lockfile
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Executar todos os testes Vitest isolados
        run: bash ./test-critical-front.sh
      - name: Validar TypeScript e build completo do frontend
        run: npm run build --prefix frontend
