<!-- templates/checkout/order_success.html -->

{% extends 'base.html' %}

{% block title %}Pedido Realizado - {{ tenant.name }}{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-16 text-center max-w-lg">
    <div class="bg-white rounded-3xl shadow-lg p-8 border border-gray-100">
        <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-gray-800 mb-2">Pedido Confirmado!</h1>
        <p class="text-gray-600 mb-6">
            Recebemos seu pedido e já estamos preparando tudo com carinho. Em breve entraremos em contato pelo WhatsApp.
        </p>

        <a href="/" class="inline-block bg-primary text-white font-medium px-6 py-3 rounded-full hover:bg-opacity-90 transition">
            Voltar ao Cardápio
        </a>
    </div>
</div>
{% endblock %}
