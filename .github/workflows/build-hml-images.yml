name: Publicar imagens da homologacao

on:
  push:
    branches: [homolog]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: hml-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  backend-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: vdd_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: hml-ci-only-not-for-deployment
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '5432'
      POSTGRES_DB: vdd_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-ci-only
      EVOLUTION_WHATSAPP_VALIDATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: npm --prefix frontend run build
      - name: Executar testes Django com renderizador React
        run: |
          node public-ssr/server.mjs > /tmp/public-ssr.log 2>&1 &
          SSR_PID=$!
          trap 'kill "$SSR_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3001/health
          python manage.py test --settings=config.settings.test --noinput

  publish:
    needs: [frontend-checks, backend-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Entrar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Definir tags
        id: images
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/${owner}/vdd-hml-backend" >> "$GITHUB_OUTPUT"
          echo "renderer=ghcr.io/${owner}/vdd-hml-public-ssr" >> "$GITHUB_OUTPUT"
      - name: Publicar backend HML
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.backend }}:homolog
            ${{ steps.images.outputs.backend }}:${{ github.sha }}
          cache-from: type=gha,scope=hml-backend
          cache-to: type=gha,mode=max,scope=hml-backend
      - name: Publicar renderizador HML
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.public-ssr
          push: true
          tags: |
            ${{ steps.images.outputs.renderer }}:homolog
            ${{ steps.images.outputs.renderer }}:${{ github.sha }}
          cache-from: type=gha,scope=hml-ssr
          cache-to: type=gha,mode=max,scope=hml-ssr
