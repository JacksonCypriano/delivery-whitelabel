services:
  web:
    build:
      context: ../../
    env_file:
      - .env
    volumes:
      - ../../:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  celery:
    build:
      context: ../../
    env_file:
      - .env
    command: ["celery"]
    volumes:
      - ../../:/app
    depends_on:
      - db
      - redis

  celery-beat:
    build:
      context: ../../
    env_file:
      - .env
    command: ["beat"]
    volumes:
      - ../../:/app
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ../../deploy/nginx/certs:/etc/nginx/ssl:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata: