{% if messages %}
<div class="mx-auto max-w-4xl px-4 pt-5" aria-live="polite">
  {% for message in messages %}
    <div role="status" class="mb-3 rounded-xl border px-4 py-3 text-sm {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-800{% else %}border-amber-200 bg-amber-50 text-amber-900{% endif %}">{{ message }}</div>
  {% endfor %}
</div>
{% endif %}
