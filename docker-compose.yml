
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delivery}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - appnet

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - appnet

  web:
    build: .
    env_file: .env
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - appnet
    restart: always

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web
    networks:
      - appnet
    restart: always

  celery:
    build: .
    env_file: .env
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
      - media_volume:/app/media
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      - db
      - redis
    networks:
      - appnet
    restart: always

  celery-beat:
    build: .
    env_file: .env
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
    command: celery -A config beat --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    networks:
      - appnet
    restart: always

volumes:
  pgdata:
  static_volume:
  media_volume:
  huggingface_cache:

networks:
  appnet:
    driver: bridge
