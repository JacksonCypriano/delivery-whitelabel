{% load static %}
<!DOCTYPE html>
<html lang="pt-br" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | {{ tenant.name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="h-full">
    <div x-data="dashApp" x-cloak>
        <!-- Sidebar para Desktop -->
        <div class="hidden lg:fixed lg:inset-y-0 lg:flex lg:w-64 lg:flex-col lg:bg-slate-900 lg:pb-4">
            <div class="flex h-16 shrink-0 items-center px-6 bg-slate-950">
                <span class="text-white font-bold text-xl">{{ tenant.name }}</span>
            </div>
            <nav class="mt-5 flex-1 space-y-1 px-2">
                <a href="/dashboard/" class="group flex items-center px-2 py-2 text-sm font-medium rounded-md text-white hover:bg-slate-800">
                    <i class="fa-solid fa-chart-line mr-3 w-5"></i> Dashboard
                </a>
                <a href="/dashboard/produtos/" class="group flex items-center px-2 py-2 text-sm font-medium rounded-md text-slate-300 hover:bg-slate-800 hover:text-white">
                    <i class="fa-solid fa-utensils mr-3 w-5"></i> Produtos
                </a>
                <a href="/dashboard/categorias/" class="group flex items-center px-2 py-2 text-sm font-medium rounded-md text-slate-300 hover:bg-slate-800 hover:text-white">
                    <i class="fa-solid fa-list mr-3 w-5"></i> Categorias
                </a>
                <a href="/dashboard/configuracoes/" class="group flex items-center px-2 py-2 text-sm font-medium rounded-md text-slate-300 hover:bg-slate-800 hover:text-white">
                    <i class="fa-solid fa-gears mr-3 w-5"></i> Configurações
                </a>
            </nav>
            <div class="px-2 border-t border-slate-800 pt-4">
                <button @click="logout" class="group flex w-full items-center px-2 py-2 text-sm font-medium rounded-md text-red-400 hover:bg-red-900/20">
                    <i class="fa-solid fa-right-from-bracket mr-3 w-5"></i> Sair
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="lg:pl-64 flex flex-col flex-1">
            <main class="py-6">
                <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
                    {% block content %}{% endblock %}
                </div>
            </main>
        </div>
    </div>

    <!-- Script de Gestão de Auth do Dashboard -->
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('dashApp', () => ({
                init() {
                    const token = localStorage.getItem('dash_access');
                    if (!token && window.location.pathname !== '/dashboard/login/') {
                        window.location.href = '/dashboard/login/';
                    }
                },
                logout() {
                    localStorage.removeItem('dash_access');
                    localStorage.removeItem('dash_refresh');
                    window.location.href = '/dashboard/login/';
                }
            }));
        });
    </script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
