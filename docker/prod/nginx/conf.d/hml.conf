# Homologacao - apenas host exato; o wildcard existente da producao permanece.
server {
    listen 80;
    listen [::]:80;
    server_name hml.vemdedelivery.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hml.vemdedelivery.com.br;
    server_tokens off;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    access_log /var/log/nginx/hml-access.log vemdedelivery_json;
    error_log /var/log/nginx/hml-error.log warn;

    # Resolver DNS dinamicamente: um backend recriado recebe outro IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $hml_backend hml-backend:8000;
    set $hml_assets hml-assets:8080;

    location ^~ /static/ {
        proxy_pass http://$hml_assets;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /media/ {
        proxy_pass http://$hml_assets;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://$hml_backend;
        proxy_http_version 1.1;
        proxy_hide_header X-Powered-By;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
