<!-- _product_card.html -->
<div class="bg-white rounded-xl shadow overflow-hidden border border-gray-100 hover:shadow-md transition group">
  <a href="{% url 'stores:product_detail' product.slug %}" class="block">
    <img 
      src="{{ product.image_url|default:'/static/images/product-placeholder.png' }}" 
      alt="{{ product.name }}" 
      class="w-full h-40 object-cover group-hover:opacity-90 transition"
    >
    <div class="p-4">
      <h3 class="font-semibold text-gray-800 group-hover:text-primary transition">{{ product.name }}</h3>
      <p class="text-xs text-gray-500 mt-1 line-clamp-2">{{ product.short_description|default:'' }}</p>

      <div class="mt-4 flex items-center justify-between">
        <span class="font-bold text-primary">R$ {{ product.price|floatformat:2 }}</span>
        <button 
          type="button"
          class="add-to-cart-btn bg-primary text-white text-sm px-3 py-1.5 rounded-lg hover:bg-opacity-90 transition"
          data-product-id="{{ product.id }}">
          Adicionar
        </button>
      </div>
    </div>
  </a>
</div>
