{% load static %}
<!DOCTYPE html>
<html lang="pt-br" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Painel administrativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full">
    <div class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8">
        <div class="sm:mx-auto sm:w-full sm:max-w-md">
            <h2 class="mt-6 text-center text-3xl font-bold tracking-tight text-gray-900">
                Painel do Lojista
            </h2>
        </div>

        <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
            <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
                <form id="login-form" class="space-y-6">
                    <!-- Erro -->
                    <div id="login-error" class="hidden rounded-md bg-red-50 p-4">
                        <p class="text-sm text-red-700" id="login-error-msg"></p>
                    </div>

                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-700">
                            Usuário
                        </label>
                        <div class="mt-1">
                            <input id="username" name="username" type="text" required
                                class="block w-full appearance-none rounded-md border border-gray-300 px-3 py-2 placeholder-gray-400 shadow-sm focus:border-slate-500 focus:outline-none focus:ring-slate-500 sm:text-sm">
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700">
                            Senha
                        </label>
                        <div class="mt-1">
                            <input id="password" name="password" type="password" required
                                class="block w-full appearance-none rounded-md border border-gray-300 px-3 py-2 placeholder-gray-400 shadow-sm focus:border-slate-500 focus:outline-none focus:ring-slate-500 sm:text-sm">
                        </div>
                    </div>

                    <div>
                        <button type="submit" id="login-btn"
                            class="flex w-full justify-center rounded-md border border-transparent bg-slate-900 py-2 px-4 text-sm font-medium text-white shadow-sm hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-2 disabled:opacity-50">
                            Entrar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Redirecionar se já estiver logado
        if (localStorage.getItem('dash_access')) {
            window.location.href = '/dashboard/';
        }

        const form = document.getElementById('login-form');
        const errorBox = document.getElementById('login-error');
        const errorMsg = document.getElementById('login-error-msg');
        const btn = document.getElementById('login-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Entrando...';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/dashboard/auth/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();

                if (response.ok && data.access) {
                    localStorage.setItem('dash_access', data.access);
                    localStorage.setItem('dash_refresh', data.refresh);
                    window.location.href = '/dashboard/';
                } else {
                    errorMsg.textContent = data.error || 'Erro ao fazer login.';
                    errorBox.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = 'Erro de conexão. Tente novamente.';
                errorBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        });
    </script>
</body>
</html>
