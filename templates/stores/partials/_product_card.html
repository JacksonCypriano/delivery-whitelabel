<!-- templates/stores/_product_card.html -->
<div
  class="product-card bg-white rounded-xl shadow overflow-hidden border border-gray-100 hover:shadow-md transition group relative"
  data-product-id="{{ product.id }}"
  data-product-name="{{ product.name }}"
  data-product-price="{{ product.price|stringformat:".2f" }}"
>
  <a href="{% url 'stores:product_detail' product.slug %}" class="block">
    <img
      src="{{ product.image_url|default:'/static/images/product-placeholder.png' }}"
      alt="{{ product.name }}"
      class="w-full h-40 object-cover group-hover:opacity-90 transition"
    >
    <div class="p-4">
      <h3 class="product-title font-semibold text-gray-800 group-hover:text-primary transition">{{ product.name }}</h3>
      <p class="text-xs text-gray-500 mt-1 line-clamp-2">{{ product.short_description|default:'' }}</p>
    </div>
  </a>

  <div class="p-4 border-t border-gray-100 flex items-center justify-between gap-3">
    <div>
      <span class="product-price font-bold text-primary">R$ {{ product.price|floatformat:2 }}</span>
    </div>

    <div class="flex items-center gap-2">
      <button
        type="button"
        class="add-to-cart-btn bg-primary text-white text-sm px-3 py-1.5 rounded-lg hover:bg-opacity-90 transition"
        data-action="add-to-cart"
        data-product-id="{{ product.id }}"
        data-product-name="{{ product.name }}"
        data-product-price="{{ product.price|stringformat:".2f" }}">
        Adicionar
      </button>

      <button
        type="button"
        class="btn-start-half inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-sm font-medium bg-amber-500 text-white hover:bg-amber-600 focus:outline-none"
        data-product-id="{{ product.id }}"
        data-product-name="{{ product.name }}"
        data-product-price="{{ product.price|stringformat:".2f" }}"
        aria-label="Montar meio a meio com {{ product.name }}">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2v10l8 4"></path>
        </svg>
        Montar Meio a Meio
      </button>
    </div>
  </div>
</div>
