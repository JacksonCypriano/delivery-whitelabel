name: Publicar produção
on:
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: vdd-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar blue/green (testes exigidos no PR)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Executar deploy blue/green na VPS
        env:
          DEPLOY_SHA: ${{ github.sha }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: DEPLOY_SHA
          script: |
            set -e
            cd /opt/vemdedelivery/app
            # Evita executar o script legado antes de atualizar o checkout.
            git fetch origin main
            # Upstream e estado operacional. O checkout novo nao deve trocar
            # o arquivo antes do deploy validar o novo backend.
            UPSTREAM=docker/prod/nginx/conf.d/active-upstream.conf
            UPSTREAM_SAVED="$(mktemp)"
            cp "$UPSTREAM" "$UPSTREAM_SAVED"
            restore_upstream_on_exit() {
              cp "$UPSTREAM_SAVED" "$UPSTREAM"
              rm -f "$UPSTREAM_SAVED"
            }
            trap restore_upstream_on_exit EXIT
            HML_CONF=docker/prod/nginx/conf.d/hml.conf
            if [ -f "$HML_CONF" ] && ! git ls-files --error-unmatch "$HML_CONF" >/dev/null 2>&1; then
              # So remove o arquivo operacional se for IDENTICO ao versionado.
              if git cat-file -e "origin/main:$HML_CONF" 2>/dev/null && git show "origin/main:$HML_CONF" | cmp -s - "$HML_CONF"; then
                cp -p "$HML_CONF" /opt/vemdedelivery/hml/backups/hml.conf-before-first-main-merge
                rm "$HML_CONF"
              else
                echo "hml.conf local diferente do Git. Deploy cancelado sem altera-lo."
                exit 1
              fi
            fi
            if ! git pull --ff-only origin main; then
              # Se o pull falhar antes de restaurar o arquivo versionado,
              # devolve a configuracao HML local ao volume do Nginx.
              if [ -f /opt/vemdedelivery/hml/backups/hml.conf-before-first-main-merge ] && [ ! -e "$HML_CONF" ]; then
                cp -p /opt/vemdedelivery/hml/backups/hml.conf-before-first-main-merge "$HML_CONF"
              fi
              exit 1
            fi
            # Restaura upstream original apos checkout, antes de qualquer reload.
            cp "$UPSTREAM_SAVED" "$UPSTREAM"
            rm -f "$UPSTREAM_SAVED"
            trap - EXIT
            # O workflow de PR protege o merge em main (regra obrigatória GitHub).
            # Verifica que o checkout publicado é EXATAMENTE o push que disparou este workflow.
            [ "$(git rev-parse HEAD)" = "$DEPLOY_SHA" ] || { echo "HEAD divergiu do push aprovado. Deploy cancelado."; exit 1; }
            VDD_DEPLOY_SHA="$DEPLOY_SHA" bash scripts/prod/blue_green_deploy.sh
